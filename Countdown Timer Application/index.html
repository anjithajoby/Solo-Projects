<!doctype html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <title>Countdown Timer</title> 
        <link rel="stylesheet" href="style.css"> 
    </head>

    <body>
        <header>
            <nav>
                <button id ="navtimer">Timer</button> <!-- Navigation bar with Timer button -->
            </nav>
        </header>
        
       
        <div class  = "image">
          <div class = "insideapple">
                <img src="apple.png" width="285" height = "275"> 

                 <!-- Timer paragraph-->
                 <p id="timer">1:00</p> 
                 
           
          </div>
            
        </div>
        
        <!--Buttons for timer-->
        <div class = "threebuttons">
            <button id ="start">Start</button>
            <button id ="stop">Stop</button>
            <button id ="pause">Pause</button>
        </div>



    <script src="script.js"></script>     
    </body>
</html>
